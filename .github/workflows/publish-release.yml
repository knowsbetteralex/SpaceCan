name: Build and publish SpaceCan TAP

on:
  push:
    branches:
      - main
    paths:
      - "**/*.asm"
      - "assets/music/*.aym"
      - "make_tap.py"
      - "build_variants.py"
      - "tests/**/*.py"
      - "docs/release_notes.md"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build sjasmplus v1.22.0
        shell: bash
        run: |
          git clone --depth 1 --branch v1.22.0 https://github.com/z00m128/sjasmplus.git "$RUNNER_TEMP/sjasmplus"
          make -C "$RUNNER_TEMP/sjasmplus" -j2 USE_LUA=0
          echo "$RUNNER_TEMP/sjasmplus" >> "$GITHUB_PATH"

      - name: Run TAP packing tests
        run: python3 -m unittest discover -s tests -v

      - name: Assemble AY and beeper-only builds and package TAPs
        shell: bash
        run: |
          python3 build_variants.py dist
          test -s dist/SpaceCan-AY.tap
          test -s dist/SpaceCan-Beeper.tap
          sha256sum dist/SpaceCan-AY.tap dist/SpaceCan-Beeper.tap

      - name: Save both downloadable TAPs as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCan-AY-and-Beeper-TAPs-${{ github.run_number }}
          path: |
            dist/SpaceCan-AY.tap
            dist/SpaceCan-Beeper.tap
          retention-days: 90
          if-no-files-found: error

      - name: Check whether this is still the latest main commit
        id: current
        shell: bash
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Newer main commit exists; skipping stale release."
          fi

      - name: Publish new GitHub release
        id: release
        if: steps.current.outputs.publish == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SpaceCan demo · build ${{ github.run_number }}
          make_latest: true
          draft: false
          prerelease: false
          body_path: docs/release_notes.md
          files: |
            dist/SpaceCan-AY.tap
            dist/SpaceCan-Beeper.tap
          fail_on_unmatched_files: true

      - name: Explain release permission failure
        if: steps.release.outcome == 'failure'
        run: |
          echo "::warning::GitHub rejected Release publication. Download both SpaceCan-AY.tap and SpaceCan-Beeper.tap from workflow Artifacts instead."
          echo "The source builds correctly; creating Releases requires enabling the appropriate repository permission or token."
